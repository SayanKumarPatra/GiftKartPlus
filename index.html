    <link rel="preconnect" href="https://ozopjebyoakjjvdsawzl.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://ozopjebyoakjjvdsawzl.supabase.co" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Tiro+Bangla:ital@0;1&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Tiro+Bangla:ital@0;1&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('giftkart:v5:language');
          var lang = raw ? JSON.parse(raw) : 'en';
          if (lang === 'bn' || lang === 'hi' || lang === 'en') {
            document.documentElement.lang = lang;
            if (lang === 'bn') {
              document.documentElement.classList.add('lang-bn');
            }
          }
        } catch (e) {}
      })();
    </script>

  <body>
    <div id="root">

      >

          style="width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,#6A11CB,#FF4D8D);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px -10px rgba(106,17,203,0.45);color:#fff;font-weight:800;font-size:22px;letter-spacing:-0.02em;"

        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        var hadController = Boolean(navigator.serviceWorker.controller);
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (!hadController) return;
          try {
            if (sessionStorage.getItem('gk_sw_reloaded_v8') === '1') return;
            sessionStorage.setItem('gk_sw_reloaded_v8', '1');
          } catch (e) {}
          window.location.reload();
        });
        window.addEventListener('load', function () {
          navigator.serviceWorker
            .register('/sw.js?v=8', { updateViaCache: 'none' })
            .then(function (reg) {
              reg.update().catch(function () {});
            })
            .catch(function () {});
        });
      }
    </script>
  </body>
</html>
